            },
            {

                description: '04高資產客群案例實戰班~案例(三)不動產族群',

                createdAt: '2026-10-27',
                comments: []
            },
            {
                id: 'tax_005',
                title: '高資專題班教案',
                category: '財富傳承',
                description: '05高資產客群案例實戰班~案例(四)高資產世族',
                fileUrl: 'https://drive.google.com/file/d/1rkUgNLV_1P0T27aTIvMFkbUStLz9bXEk/preview',
                status: '徵求回饋中',
                isLocked: false,

            {

                status: '徵求回饋中',
                isLocked: false,

                createdAt: '2026-10-27',

            },
            {
                id: 'tax_007',
                title: '高資專題班教案',
                category: '財富傳承',
                description: '07高資產客群案例實戰班~終極案例挑戰',
                fileUrl: 'https://drive.google.com/file/d/1NZm8M4ffeqwwL7mnmnFmSrfQLCk6-42C/preview',
                status: '徵求回饋中',
                isLocked: false,
                createdBy: 'PM管理員',
                createdAt: '2026-10-27',
                comments: []
            }
        ];

        let categories = sampleCategories;
        let lessons = sampleLessons;
        let pmPassword = localStorage.getItem('estate_pm_password') || 'pm1234';
        let isPMMode = false;
        let currentFilterCat = 'all';
        let activeLessonId = null;

        let cloudReady = false;
        let baselineLessons = [];
        let baselineCategories = [];
        const clone = value => JSON.parse(JSON.stringify(value));
        const asList = value => (Array.isArray(value) ? value : Object.values(value || {})).filter(Boolean);
        const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const handlerArg = value => escapeHTML(JSON.stringify(String(value)));
        function syncMessage(text, error = false) {
            document.getElementById('syncStatusTag').textContent = text;
            document.getElementById('connectionMessage').textContent = error ? text + '；變更尚未確認儲存，請勿關閉本頁。請 PM 確認資料庫網址與存取規則。' : text;
        }
        function configureDatabase() {
            if (!isPMMode) return;
            const url = prompt('請貼上 Firebase Console → Realtime Database 的資料庫網址（不是網站網址）：', localStorage.getItem('estate_database_url') || '');
            if (url === null) return;
            if (!/^https:\/\/[a-zA-Z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/.test(url.trim())) return alert('請填入有效的 Firebase Realtime Database HTTPS 網址。');
            localStorage.setItem('estate_database_url', url.trim());
            location.reload();
        }
        window.addEventListener('load', () => {
            const savedName = localStorage.getItem('estate_user_name');
            if (savedName) document.getElementById('commentAuthor').value = savedName;
            renderCategories(); renderCards();
            syncMessage('正在連線；先顯示七份預設教案');
            let attempts = 0;
            const timer = setInterval(() => {
                if (window.fbDb) { clearInterval(timer); initFirebaseListener(); }
                else if (++attempts >= 25 || window.fbInitError) {
                    clearInterval(timer); syncMessage('雲端尚未連線，僅供預覽。' + (window.fbInitError || ''), true);
                }
            }, 300);
        });
        function initFirebaseListener() {
            let lessonsLoaded = false, categoriesLoaded = false;
            const fail = error => { cloudReady = false; syncMessage('雲端連線失敗：' + error.message, true); };
            const ready = () => {
                cloudReady = lessonsLoaded && categoriesLoaded;
                if (cloudReady) syncMessage('雲端資料已載入');
            };
            window.fbOnValue(window.fbRef(window.fbDb, 'estate_lessons'), snapshot => {
                const remote = asList(snapshot.val());
                baselineLessons = clone(remote);
                // 預設教案補入畫面，不覆蓋雲端已有的教案與留言。
                lessons = remote.concat(sampleLessons.filter(sample => !remote.some(item => item.id === sample.id))).map(item => ({...item, comments: asList(item.comments)}));
                lessonsLoaded = true; renderCards(); ready();
                if (activeLessonId) { const item = lessons.find(l => l.id === activeLessonId); if (item) renderComments(item); }
            }, fail);
            window.fbOnValue(window.fbRef(window.fbDb, 'estate_categories'), snapshot => {
                baselineCategories = asList(snapshot.val());
                categories = [...new Set([...(snapshot.val() === null ? sampleCategories : baselineCategories), ...lessons.filter(l => !l.isArchived).map(l => l.category)])];
                categoriesLoaded = true; renderCategories(); ready();
            }, fail);
            setTimeout(() => { if (!cloudReady) syncMessage('雲端讀取尚未完成，請檢查連線或設定資料庫網址', true); }, 10000);
        }
        async function saveToCloud() {
            renderCategories(); renderCards();
            if (!cloudReady || !window.fbDb) { syncMessage('尚未連線，無法儲存', true); return false; }
            const desired = clone(lessons), before = clone(baselineLessons);
            const wantedCategories = clone(categories), beforeCategories = clone(baselineCategories);
            syncMessage('正在儲存…');
            try {
                await window.fbTransaction(window.fbRef(window.fbDb, 'estate_lessons'), current => {
                    const remote = asList(current);
                    for (const old of before) {
                        if (!desired.some(l => l.id === old.id)) { const i = remote.findIndex(l => l.id === old.id); if (i >= 0) remote.splice(i, 1); }
                    }
                    for (const item of desired) {
                        const old = before.find(l => l.id === item.id);
                        if (old && JSON.stringify(old) === JSON.stringify(item)) continue;
                        const i = remote.findIndex(l => l.id === item.id);
                        if (i < 0) { if (!old) remote.push(item); continue; }
                        const merged = {...remote[i]};
                        for (const key of Object.keys(item)) if (key !== 'comments' && (!old || JSON.stringify(item[key]) !== JSON.stringify(old[key]))) merged[key] = item[key];
                        const comments = asList(merged.comments);
                        for (const comment of asList(item.comments)) {
                            const prior = asList(old?.comments).find(c => c.id === comment.id);
                            if (prior && JSON.stringify(prior) === JSON.stringify(comment)) continue;
                            const j = comments.findIndex(c => c.id === comment.id);
                            if (j < 0) comments.push(comment); else comments[j] = comment;
                        }
                        merged.comments = comments; remote[i] = merged;
                    }
                    return remote;
                }, {applyLocally: false});
                await window.fbTransaction(window.fbRef(window.fbDb, 'estate_categories'), current => [...new Set([...asList(current).filter(c => !beforeCategories.includes(c) || wantedCategories.includes(c)), ...wantedCategories.filter(c => !beforeCategories.includes(c))])], {applyLocally: false});
                syncMessage('已儲存至雲端'); return true;
            } catch (error) { syncMessage('儲存失敗：' + error.message, true); return false; }
        }
        function exportFeedback(id) {
            const rows = [['教案名稱','教案摘要','教案分類','教案狀態','講師姓名','建議類型','頁數或章節','建議內容','採納狀態','留言時間']];
            for (const lesson of lessons.filter(l => !l.isArchived && (!id || l.id === id))) {
                const comments = asList(lesson.comments);
                for (const c of comments.length ? comments : [{}]) rows.push([lesson.title, lesson.description, lesson.category, lesson.status, c.author, c.category, c.page, c.content || '尚無回饋', c.id ? (c.isAdopted ? '已採納' : '待討論') : '', c.createdAt]);
            }
            const csvCell = value => { let v = String(value ?? ''); if (/^[\s]*[=+@-]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
            const blob = new Blob(['\uFEFF' + rows.map(row => row.map(csvCell).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8;'});
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob);
            link.download = '教案回饋_' + (id || '全部') + '_' + new Date().toLocaleDateString('sv-SE') + '.csv';
            link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = `
                <button onclick="filterCategory('all')" class="cat-filter-btn ${currentFilterCat === 'all' ? 'bg-emerald-100 text-emerald-800 font-medium border-emerald-300' : 'bg-slate-100 text-slate-600'} px-3 py-1 rounded-full text-xs transition border shrink-0">全部教案</button>
            `;

            categories.forEach(cat => {
                const wrapper = document.createElement('div');
                wrapper.className = "inline-flex items-center shrink-0";
                const isActive = currentFilterCat === cat;
                const activeStyle = isActive ? 'bg-emerald-100 text-emerald-800 font-medium border-emerald-300' : 'bg-slate-100 text-slate-600 hover:bg-slate-200';

                wrapper.innerHTML = `
                    <button onclick="filterCategory(${handlerArg(cat)})" class="cat-filter-btn ${activeStyle} ${isPMMode ? 'rounded-l-full pr-1' : 'rounded-full px-3'} py-1 text-xs transition border-y border-l border-r ${!isPMMode ? 'border-r' : 'border-r-0'} shrink-0">
                        ${escapeHTML(cat)}
                    </button>
                    ${isPMMode ? `
                        <button onclick="deleteCategory(${handlerArg(cat)})" title="刪除 ${escapeHTML(cat)} 分類" class="${activeStyle} border-y border-r border-slate-300 rounded-r-full pr-2 pl-1 py-1 text-xs text-slate-400 hover:text-rose-600 transition">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    ` : ''}
                `;
                container.appendChild(wrapper);
            });

            const select = document.getElementById('newCategory');
            select.innerHTML = '';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });
        }

        function deleteCategory(catName) {
            if (!isPMMode) return;
            if (confirm(`確定要刪除「${catName}」分類嗎？`)) {
                categories = categories.filter(c => c !== catName);
                if (currentFilterCat === catName) currentFilterCat = 'all';
                saveToCloud();
            }
        }

        function addNewCategoryPrompt() {
            if (!isPMMode) return;
            const newCat = prompt('請輸入欲新增的教案分類名稱：');
            if (newCat && newCat.trim() !== '') {
                const trimmed = newCat.trim();
                if (!categories.includes(trimmed)) {
                    categories.push(trimmed);
                    saveToCloud();
                } else {
                    alert('此分類已經存在！');
                }
            }
        }

        function togglePMMode() {
            if (!isPMMode) {
                const pass = prompt('請輸入 PM 管理員通行密碼：');
                if (pass === pmPassword) {
                    isPMMode = true;
                    document.getElementById('pmStatusText').innerText = 'PM 模式：開啟中';
                    document.getElementById('pmModeBtn').classList.replace('bg-emerald-700', 'bg-amber-600');
                    document.getElementById('addCatBtn').classList.remove('hidden');
                    document.getElementById('changePmPassBtn').classList.remove('hidden');
                } else if (pass !== null) {
                    alert('密碼錯誤！');
                }
            } else {
                isPMMode = false;
                document.getElementById('pmStatusText').innerText = 'PM 模式：關閉';
                document.getElementById('pmModeBtn').classList.replace('bg-amber-600', 'bg-emerald-700');
                document.getElementById('addCatBtn').classList.add('hidden');
                document.getElementById('changePmPassBtn').classList.add('hidden');
            }
            document.getElementById('addLessonBtn').classList.toggle('hidden', !isPMMode);
            document.getElementById('databaseConfigBtn').classList.toggle('hidden', !isPMMode);
            renderCategories();
            renderCards();
            if (activeLessonId) openSplitModal(activeLessonId);
        }

        function changePMPassword() {
            const current = prompt('請輸入舊的 PM 密碼：');
            if (current === pmPassword) {
                const newPass = prompt('請輸入新設定的 PM 密碼：');
                if (newPass && newPass.trim() !== '') {
                    pmPassword = newPass.trim();
                    localStorage.setItem('estate_pm_password', pmPassword);
                    alert('PM 管理密碼已成功修改！');
                }
            } else if (current !== null) {
                alert('舊密碼驗證失敗！');
            }
        }

        function renderCards() {
            const grid = document.getElementById('cardGrid');
            const searchKw = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = lessons.filter(item => {
                const matchCat = currentFilterCat === 'all' || item.category === currentFilterCat;
                const matchKw = item.title.toLowerCase().includes(searchKw) || 
                                item.description.toLowerCase().includes(searchKw);
                return !item.isArchived && matchCat && matchKw;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">
                    <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
                    <p>沒有找到相符的教案內容</p>
                </div>`;
                return;
            }

            filtered.forEach(lesson => {
                const commentCount = lesson.comments ? lesson.comments.length : 0;
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden relative";

                let statusBg = 'bg-slate-100 text-slate-600';
                if (lesson.status === '徵求回饋中') statusBg = 'bg-amber-100 text-amber-800 border-amber-300';
                if (lesson.status === '修改中') statusBg = 'bg-blue-100 text-blue-800 border-blue-300';
                if (lesson.status === '已完稿') statusBg = 'bg-emerald-100 text-emerald-800 border-emerald-300';

                let pmControlHTML = '';
                if (isPMMode) {
                    pmControlHTML = `
                        <div class="bg-amber-50 p-2.5 border-t border-amber-200 flex justify-between items-center text-xs gap-1">
                            <div class="flex gap-1">
                                <button onclick="openEditLessonModal(${handlerArg(lesson.id)})" class="px-2.5 py-1 bg-blue-600 text-white rounded font-bold shadow-sm"><i class="fa-solid fa-pen"></i> 編輯</button>
                                <button onclick="deleteLesson(${handlerArg(lesson.id)})" class="px-2.5 py-1 bg-rose-600 text-white rounded font-bold shadow-sm"><i class="fa-solid fa-trash"></i> 刪除</button>
                            </div>
                            <div class="flex gap-1 items-center">
                                <button onclick="toggleLock(${handlerArg(lesson.id)})" class="px-2 py-1 bg-white border border-amber-300 rounded font-medium">${lesson.isLocked ? '🔓 解鎖' : '🔒 鎖定'}</button>
                                <select onchange="changeStatus(${handlerArg(lesson.id)}, this.value)" class="bg-white border border-amber-300 rounded px-1.5 py-1 font-medium">
                                    <option value="徵求回饋中" ${lesson.status==='徵求回饋中'?'selected':''}>徵求中</option>
                                    <option value="修改中" ${lesson.status==='修改中'?'selected':''}>修改中</option>
                                    <option value="已完稿" ${lesson.status==='已完稿'?'selected':''}>已完稿</option>
                                </select>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="p-5">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <span class="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full border border-slate-200">${escapeHTML(lesson.category)}</span>
                            <div class="flex items-center gap-1">
                                ${lesson.isLocked ? '<span class="text-xs bg-rose-100 text-rose-700 px-2 py-0.5 rounded font-bold"><i class="fa-solid fa-lock"></i> 鎖定</span>' : ''}
                                <span class="text-xs px-2.5 py-1 rounded-full border font-bold ${statusBg}">${escapeHTML(lesson.status)}</span>
                            </div>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base mb-2 hover:text-emerald-700 cursor-pointer" onclick="openSplitModal(${handlerArg(lesson.id)})">${escapeHTML(lesson.title)}</h3>
                        <p class="text-xs text-slate-500 line-clamp-2 mb-4">${escapeHTML(lesson.description)}</p>
                        <div class="text-xs text-slate-400 flex items-center justify-between border-t border-slate-100 pt-3">
                            <span>建立者：${escapeHTML(lesson.createdBy)}</span>
                            <span>${escapeHTML(lesson.createdAt)}</span>
                        </div>
                    </div>
                    <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 flex items-center justify-between">
                        <button onclick="openSplitModal(${handlerArg(lesson.id)})" class="text-xs text-emerald-700 font-bold hover:text-emerald-900 flex items-center gap-1">
                            <i class="fa-solid fa-book-open"></i> 預覽與留言
                        </button>
                        <span class="text-xs text-slate-500 font-medium bg-slate-200/60 px-2 py-0.5 rounded-full">💬 ${commentCount} 則建議</span>
                    </div>
                    <button onclick="exportFeedback(${handlerArg(lesson.id)})" class="text-xs text-emerald-800 px-5 py-2 text-left border-t">匯出此教案回饋 CSV</button>
                    ${pmControlHTML}
                `;
                grid.appendChild(card);
            });
        }

        function openEditLessonModal(id) {
            if (!isPMMode) return;
            const lesson = lessons.find(l => l.id === id);
            if (!lesson) return;
            document.getElementById('editLessonId').value = lesson.id;
            document.getElementById('newTitle').value = lesson.title;
            document.getElementById('newCategory').value = lesson.category;
            document.getElementById('newFileUrl').value = lesson.fileUrl;
            document.getElementById('newDescription').value = lesson.description;
            document.getElementById('lessonModalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-blue-600"></i> 編輯教案資料';
            document.getElementById('addLessonModal').classList.remove('hidden');
        }

        function deleteLesson(id) {
            if (!isPMMode) return;
            if (confirm('確定要徹底刪除此教案嗎？')) {
                const lesson = lessons.find(l => l.id === id);
                if (lesson) lesson.isArchived = true;
                saveToCloud();
            }
        }

        async function handleSaveLesson(e) {
            e.preventDefault();
            if (!isPMMode || !cloudReady) return alert('請先開啟 PM 模式並確認雲端連線成功。');
            const editId = document.getElementById('editLessonId').value;
            const title = document.getElementById('newTitle').value.trim();
            const category = document.getElementById('newCategory').value;
            const fileUrl = document.getElementById('newFileUrl').value.trim();
            const description = document.getElementById('newDescription').value.trim();

            if (!title || !category) return alert('請填寫名稱與分類。');
            const driveMatch = fileUrl.match(/^https:\/\/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (!driveMatch) return alert('請使用 Google Drive 檔案分享連結，並於原始檔設定檢視者與下載限制。');
            const previewUrl = 'https://drive.google.com/file/d/' + driveMatch[1] + '/preview';
            if (editId) {
                const lesson = lessons.find(l => l.id === editId);
                if (lesson) {
                    lesson.title = title;
                    lesson.category = category;
                    lesson.fileUrl = previewUrl;
                    lesson.description = description;
                }
            } else {
                const newLesson = {
                    id: 'tax_' + Date.now(),
                    title,
                    category,
                    fileUrl: previewUrl,
                    description,
                    status: '徵求回饋中',
                    isLocked: false,
                    createdBy: isPMMode ? 'PM 管理員' : '莊園講師',
                    createdAt: new Date().toISOString().split('T')[0],
                    comments: []
                };
                lessons.unshift(newLesson);
            }

            if (await saveToCloud()) closeAddLessonModal();
        }

        function openAddLessonModal() {
            if (!isPMMode) return;
            document.getElementById('editLessonId').value = '';
            document.getElementById('lessonModalTitle').innerHTML = '<i class="fa-solid fa-file-circle-plus text-emerald-600"></i> 發布新教案';
            document.querySelector('#addLessonModal form').reset();
            document.getElementById('addLessonModal').classList.remove('hidden');
        }

        function closeAddLessonModal() {
            document.getElementById('addLessonModal').classList.add('hidden');
        }

        function openSplitModal(id) {
            activeLessonId = id;
            const lesson = lessons.find(l => l.id === id);
            if (!lesson) return;

            document.getElementById('modalTitle').innerText = lesson.title;
            document.getElementById('modalCatTag').innerText = lesson.category;
            document.getElementById('pdfIframe').src = lesson.fileUrl;

            const lockBadge = document.getElementById('modalLockBadge');
            const commentForm = document.getElementById('commentForm');
            const lockNotice = document.getElementById('lockWarningNotice');

            if (lesson.isLocked) {
                lockBadge.classList.remove('hidden');
                commentForm.classList.remove('opacity-50', 'pointer-events-none');
                lockNotice.classList.remove('hidden');
            } else {
                lockBadge.classList.add('hidden');
                commentForm.classList.remove('opacity-50', 'pointer-events-none');
                lockNotice.classList.add('hidden');
            }

            cancelCommentEdit();
            renderComments(lesson);
            document.getElementById('splitViewerModal').classList.remove('hidden');
        }

        function closeSplitModal() {
            document.getElementById('splitViewerModal').classList.add('hidden');
            document.getElementById('pdfIframe').src = '';
            activeLessonId = null;
        }

        function renderComments(lesson) {
            const list = document.getElementById('modalCommentsList');
            const countSpan = document.getElementById('modalCommentCount');
            list.innerHTML = '';
            
            const comments = lesson.comments || [];
            countSpan.innerText = `${comments.length} 則建議`;

            if (comments.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">尚未有講師提出修訂建議，歡迎留下第一個想法！</div>`;
                return;
            }

            const currentUser = (document.getElementById('commentAuthor').value || '').trim();

            comments.forEach(c => {
                const div = document.createElement('div');
                div.className = `p-3 rounded-lg border text-xs space-y-1 ${c.isAdopted ? 'bg-amber-50/80 border-amber-300' : 'bg-slate-50 border-slate-200'}`;
                const canEdit = isPMMode;

                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-slate-700">${escapeHTML(c.author)}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-slate-400">${escapeHTML(c.createdAt)}</span>
                            ${canEdit ? `<button onclick="startEditComment(${handlerArg(c.id)})" class="text-[10px] text-blue-600 hover:underline font-bold"><i class="fa-solid fa-pen"></i> 編輯</button>` : ''}
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-1 my-1">
                        <span class="bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded text-[10px] font-medium">${escapeHTML(c.category)}</span>
                        ${c.page ? `<span class="bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded text-[10px]">${escapeHTML(c.page)}</span>` : ''}
                        ${c.isAdopted ? `<span class="bg-amber-500 text-white font-bold px-1.5 py-0.5 rounded text-[10px]"><i class="fa-solid fa-award"></i> 已採納至 V2</span>` : ''}
                    </div>
                    <p class="text-slate-600 leading-relaxed whitespace-pre-wrap">${escapeHTML(c.content)}</p>
                    ${isPMMode ? `
                        <div class="pt-1 flex justify-end">
                            <button onclick="toggleAdoptComment(${handlerArg(c.id)})" class="text-[10px] text-amber-800 underline font-bold">
                                ${c.isAdopted ? '取消採納標記' : '✅ 標記為採納'}
                            </button>
                        </div>
                    ` : ''}
                `;
                list.appendChild(div);
            });
        }

        function startEditComment(commentId) {
            if (!isPMMode) return;
            const lesson = lessons.find(l => l.id === activeLessonId);
            if (!lesson) return;
            const comment = (lesson.comments || []).find(c => c.id === commentId);
            if (!comment) return;

            document.getElementById('editingCommentId').value = comment.id;
            document.getElementById('commentAuthor').value = comment.author;
            document.getElementById('commentCategory').value = comment.category;
            document.getElementById('commentPage').value = comment.page || '';
            document.getElementById('commentContent').value = comment.content;

            document.getElementById('submitCommentBtnText').innerText = '儲存修改建議';
            document.getElementById('cancelEditCommentBtn').classList.remove('hidden');
        }

        function cancelCommentEdit() {
            document.getElementById('editingCommentId').value = '';
            document.getElementById('commentContent').value = '';
            document.getElementById('commentPage').value = '';
            document.getElementById('submitCommentBtnText').innerText = '發布建議回饋';
            document.getElementById('cancelEditCommentBtn').classList.add('hidden');
        }

        async function handleAddComment(e) {
            e.preventDefault();
            if (!activeLessonId) return;
            if (!cloudReady) return alert('雲端尚未連線，請稍後再送出回饋。');

            const lesson = lessons.find(l => l.id === activeLessonId);


            const author = document.getElementById('commentAuthor').value.trim();
            const category = document.getElementById('commentCategory').value;
            const page = document.getElementById('commentPage').value.trim();
            const content = document.getElementById('commentContent').value.trim();
            const editingId = document.getElementById('editingCommentId').value;

            if (!author) {
                alert('請先填寫您的姓名/講師名稱！');
                document.getElementById('commentAuthor').focus();
                return;
            }

            if (!content) return;
            localStorage.setItem('estate_user_name', author);

            if (!lesson.comments) lesson.comments = [];

            if (editingId) {
                if (!isPMMode) return;
                const comment = lesson.comments.find(c => c.id === editingId);
                if (comment) {
                    comment.author = author;
                    comment.category = category;
                    comment.page = page;
                    comment.content = content;
                }
            } else {
                const newComment = {
                    id: 'c_' + Date.now(),
                    author,
                    category,
                    page,
                    content,
                    isAdopted: false,
                    createdAt: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
                };
                lesson.comments.push(newComment);
            }

            if (await saveToCloud()) cancelCommentEdit();
        }

        function toggleLock(id) {
            if (!isPMMode) return;
            const lesson = lessons.find(l => l.id === id);
            if (lesson) {
                lesson.isLocked = !lesson.isLocked;
                saveToCloud();
            }
        }

        function changeStatus(id, newStatus) {
            if (!isPMMode) return;
            const lesson = lessons.find(l => l.id === id);
            if (lesson) {
                lesson.status = newStatus;
                saveToCloud();
            }
        }

        function toggleAdoptComment(commentId) {
            if (!isPMMode) return;
            const lesson = lessons.find(l => l.id === activeLessonId);
            if (lesson && lesson.comments) {
                const comment = lesson.comments.find(c => c.id === commentId);
                if (comment) {
                    comment.isAdopted = !comment.isAdopted;
                    saveToCloud();
                }
            }
        }

        function filterCategory(cat) {
            currentFilterCat = cat;
            renderCategories();
            renderCards();
        }
    </script>
</body>
