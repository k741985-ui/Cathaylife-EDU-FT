    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, get, runTransaction } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, inMemoryPersistence, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        const firebaseConfig = {
            apiKey: "AIzaSyAdIAh1uG2RZ2CdV3xqkhCafZ4Vm3wEabM",
            authDomain: "tax-estate-edu.firebaseapp.com",
            projectId: "tax-estate-edu",
            databaseURL: "https://tax-estate-edu-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "tax-estate-edu.firebasestorage.app",
            messagingSenderId: "664980813915",
            appId: "1:664980813915:web:db40721c16877e5d5fe77e",
            measurementId: "G-KYNR5QK9H9"
        };

        const app = initializeApp(firebaseConfig);
        let db;
        try { db = getDatabase(app, localStorage.getItem('estate_database_url') || undefined); }
        catch (error) { window.fbInitError = error.message; }
        window.fbTransaction = runTransaction;
        window.fbDb = db;
        window.fbRef = ref;
        window.fbOnValue = onValue;
        window.fbSet = set;
        window.fbGet = get;
        window.fbAuth = getAuth(app);
        window.fbLogin = signInWithEmailAndPassword;
        window.fbLogout = signOut;
        window.fbAuthChanged = onAuthStateChanged;
        window.fbSetPersistence = () => setPersistence(window.fbAuth, inMemoryPersistence);
        window.fbResetPassword = sendPasswordResetEmail;
    </script>

    <!-- JS 業務邏輯 -->
    <script>
        const sampleCategories = [];
        const sampleLessons = [];
        let categories = [];
        let lessons = [];
        let isPMMode = false;
        let currentFilterCat = 'all';
        let activeLessonId = null;

        let cloudReady = false;
        let baselineLessons = [];
        let baselineCategories = [];
        const clone = value => JSON.parse(JSON.stringify(value));
        const asList = value => (Array.isArray(value) ? value : Object.values(value || {})).filter(Boolean);
        const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const handlerArg = value => escapeHTML(JSON.stringify(String(value)));
        function syncMessage(text, error = false) {
            document.getElementById('syncStatusTag').textContent = text;
            document.getElementById('connectionMessage').textContent = error ? text + '；變更尚未確認儲存，請勿關閉本頁。請 PM 確認資料庫網址與存取規則。' : text;
        }
        function configureDatabase() {
            if (!isPMMode) return;
            const url = prompt('請貼上 Firebase Console → Realtime Database 的資料庫網址（不是網站網址）：', localStorage.getItem('estate_database_url') || '');
            if (url === null) return;
            if (!/^https:\/\/[a-zA-Z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/.test(url.trim())) return alert('請填入有效的 Firebase Realtime Database HTTPS 網址。');
            localStorage.setItem('estate_database_url', url.trim());
            location.reload();
        }
        const TEAM_ACCOUNT_EMAIL = 'board-viewer@tax-estate-edu.firebaseapp.com'; // Account identifier only; never store a password in source.
        let entryIsPM = false;
        let currentUser = null;
        let currentRole = null;
        let accessVersion = 0;
        let unsubscribeData = [];
        let lessonPaths = {};
        function switchEntryMode() {
            entryIsPM = !entryIsPM;
            document.getElementById('entryEmailGroup').hidden = !entryIsPM;
            document.getElementById('entryEmail').required = entryIsPM;
            document.getElementById('entryMode').textContent = entryIsPM ? '返回團隊密碼登入' : 'PM 管理者登入';
            document.getElementById('gateDescription').textContent = entryIsPM ? '請使用獲授權的 PM 帳號與密碼登入。' : '請輸入團隊共用密碼，進入後即可瀏覽教案與提出建議。';
            document.getElementById('entryPassword').value = '';
            document.getElementById('entryError').textContent = '';
        }
        function clearWall() {
            unsubscribeData.forEach(fn => fn()); unsubscribeData = [];
            currentUser = null; currentRole = null; isPMMode = false; cloudReady = false;
            lessons = []; categories = []; baselineLessons = []; baselineCategories = []; lessonPaths = {};
            activeLessonId = null;
            document.getElementById('wallApp').hidden = true;
            document.getElementById('entryGate').hidden = false;
            document.getElementById('cardGrid').innerHTML = '';
            document.getElementById('categoryContainer').innerHTML = '';
            document.getElementById('modalCommentsList').innerHTML = '';
            document.getElementById('pdfIframe').src = '';
            document.getElementById('splitViewerModal').classList.add('hidden');
            document.getElementById('addLessonModal').classList.add('hidden');
            document.getElementById('commentContent').value = '';
            document.getElementById('entryPassword').value = '';
        }
        function updateRoleControls() {
            for (const id of ['addLessonBtn','databaseConfigBtn','addCatBtn','changePmPassBtn']) document.getElementById(id).classList.toggle('hidden', !isPMMode);
            document.getElementById('importLessonsControl').hidden = !isPMMode;
            document.getElementById('pmStatusText').textContent = isPMMode ? 'PM 管理：已登入' : '切換 PM 管理帳號';
        }
        async function loginToWall(event) {
            event.preventDefault();
            const button = document.getElementById('entrySubmit');
            const errorBox = document.getElementById('entryError');
            let password = document.getElementById('entryPassword').value;
            if (!password || !window.fbAuth) return;
            const email = entryIsPM ? document.getElementById('entryEmail').value.trim() : TEAM_ACCOUNT_EMAIL;
            button.disabled = true; button.textContent = '正在驗證…'; errorBox.textContent = '';
            try { await window.fbLogin(window.fbAuth, email, password); }
            catch (error) {
                const messages = {'auth/operation-not-allowed':'尚未啟用電子郵件／密碼登入，請 PM 完成 Firebase 設定。','auth/too-many-requests':'嘗試次數較多，請稍後再試。','auth/network-request-failed':'連線失敗，請檢查網路後再試。'};
                errorBox.textContent = messages[error.code] || '密碼不正確，或帳號尚未設定完成。請向 PM 確認。';
            } finally {
                password = ''; document.getElementById('entryPassword').value = '';
                button.disabled = false; button.textContent = '進入教案回饋牆';
            }
        }
        async function logoutFromWall() {
            accessVersion++; clearWall();
            try { await window.fbLogout(window.fbAuth); }
            catch { document.getElementById('entryError').textContent = '登出未完成，請關閉此頁。'; }
        }
        async function handleAuthChange(user) {
            const version = ++accessVersion;
            clearWall();
            if (!user) return;
            try {
                const snapshot = await window.fbGet(window.fbRef(window.fbDb, 'estate_access/' + user.uid));
                if (version !== accessVersion) return;

                if (role !== 'viewer' && role !== 'pm') throw new Error('not-authorized');

            } catch {
                if (version !== accessVersion) return;
                await logoutFromWall();
                document.getElementById('entryError').textContent = '帳號尚未獲授權，或資料庫規則尚未設定。請 PM 完成設定後再試。';

            if (savedName) document.getElementById('commentAuthor').value = savedName;
            let attempts = 0;
            const timer = setInterval(async () => {
                if (window.fbDb && window.fbAuth) {
                    clearInterval(timer);

                        await window.fbSetPersistence();
                        window.fbAuthChanged(window.fbAuth, handleAuthChange);

                    } catch { document.getElementById('entryError').textContent = '無法啟動安全登入，請重新整理後再試。'; }
                } else if (++attempts >= 40 || window.fbInitError) {
                    clearInterval(timer);
                    document.getElementById('entryError').textContent = '無法連線至登入服務，請檢查網路後重新整理。';

        async function importLessons(event) {
            if (!isPMMode || !cloudReady) return;
            const file = event.target.files[0]; if (!file) return;
            try {
                if (file.size > 2000000) throw new Error('檔案過大');
                const data = JSON.parse(await file.text());
                const incoming = asList(data.estate_lessons || data);
                if (!incoming.length || incoming.some(l => !/^tax_[a-zA-Z0-9_-]+$/.test(l.id) || !l.title || !/^https:\/\/drive\.google\.com\/file\/d\/[a-zA-Z0-9_-]+\/preview$/.test(l.fileUrl))) throw new Error('教案格式不正確');
                await window.fbTransaction(window.fbRef(window.fbDb,'estate_lessons'), current => {
                    const remote = asList(current);
                    for (const lesson of incoming) if (!remote.some(l => l.id === lesson.id)) remote.push(lesson);
                    return remote;
                }, {applyLocally:false});
                if (data.estate_categories) await window.fbTransaction(window.fbRef(window.fbDb,'estate_categories'), current => [...new Set([...asList(current), ...asList(data.estate_categories)])], {applyLocally:false});
                syncMessage('匯入完成；保留雲端已有教案與留言');
            } catch (error) { alert('匯入失敗：' + error.message); }
            finally { event.target.value = ''; }
        }
        function initFirebaseListener() {
            if (!currentUser || !currentRole) return;
            const version = accessVersion;
            let lessonsLoaded = false, categoriesLoaded = false;
            const fail = error => { if (version !== accessVersion) return; logoutFromWall().then(() => { document.getElementById('entryError').textContent = '無法讀取資料，請 PM 確認存取權限。'; }); };
            const ready = () => {
                cloudReady = lessonsLoaded && categoriesLoaded;
                if (cloudReady) syncMessage('雲端資料已載入');
            };
            unsubscribeData.push(window.fbOnValue(window.fbRef(window.fbDb, 'estate_lessons'), snapshot => {
                if (version !== accessVersion) return;
                lessonPaths = Object.fromEntries(Object.entries(snapshot.val() || {}).filter(([,v]) => v && v.id).map(([key,v]) => [v.id,key]));
                const remote = asList(snapshot.val());
                baselineLessons = clone(remote);
                // 預設教案補入畫面，不覆蓋雲端已有的教案與留言。
                lessons = remote.concat(sampleLessons.filter(sample => !remote.some(item => item.id === sample.id))).map(item => ({...item, comments: asList(item.comments)}));
                lessonsLoaded = true; renderCards(); ready();
                if (activeLessonId) { const item = lessons.find(l => l.id === activeLessonId); if (item) renderComments(item); }
            }, fail));
            unsubscribeData.push(window.fbOnValue(window.fbRef(window.fbDb, 'estate_categories'), snapshot => {
                if (version !== accessVersion) return;
                baselineCategories = asList(snapshot.val());
                categories = [...new Set([...(snapshot.val() === null ? sampleCategories : baselineCategories), ...lessons.filter(l => !l.isArchived).map(l => l.category)])];
                categoriesLoaded = true; renderCategories(); ready();
            }, fail));
            setTimeout(() => { if (version === accessVersion && !cloudReady) syncMessage('雲端讀取尚未完成，請檢查連線或設定資料庫網址', true); }, 10000);
        }
        async function saveToCloud() {
            if (!currentUser || !isPMMode) return false;
            renderCategories(); renderCards();
            if (!cloudReady || !window.fbDb) { syncMessage('尚未連線，無法儲存', true); return false; }
            const desired = clone(lessons), before = clone(baselineLessons);
            const wantedCategories = clone(categories), beforeCategories = clone(baselineCategories);
            syncMessage('正在儲存…');
            try {
                await window.fbTransaction(window.fbRef(window.fbDb, 'estate_lessons'), current => {
                    const remote = asList(current);
                    for (const old of before) {
                        if (!desired.some(l => l.id === old.id)) { const i = remote.findIndex(l => l.id === old.id); if (i >= 0) remote.splice(i, 1); }
                    }
                    for (const item of desired) {
                        const old = before.find(l => l.id === item.id);
                        if (old && JSON.stringify(old) === JSON.stringify(item)) continue;
                        const i = remote.findIndex(l => l.id === item.id);
                        if (i < 0) { if (!old) remote.push(item); continue; }
                        const merged = {...remote[i]};
                        for (const key of Object.keys(item)) if (key !== 'comments' && (!old || JSON.stringify(item[key]) !== JSON.stringify(old[key]))) merged[key] = item[key];
                        const comments = asList(merged.comments);
                        for (const comment of asList(item.comments)) {
                            const prior = asList(old?.comments).find(c => c.id === comment.id);
                            if (prior && JSON.stringify(prior) === JSON.stringify(comment)) continue;
                            const j = comments.findIndex(c => c.id === comment.id);
                            if (j < 0) comments.push(comment); else comments[j] = comment;
                        }
                        merged.comments = comments; remote[i] = merged;
                    }
                    return remote;
                }, {applyLocally: false});
                await window.fbTransaction(window.fbRef(window.fbDb, 'estate_categories'), current => [...new Set([...asList(current).filter(c => !beforeCategories.includes(c) || wantedCategories.includes(c)), ...wantedCategories.filter(c => !beforeCategories.includes(c))])], {applyLocally: false});
                syncMessage('已儲存至雲端'); return true;
            } catch (error) { syncMessage('儲存失敗：' + error.message, true); return false; }
        }
        function exportFeedback(id) {
            if (!currentUser || !cloudReady) return alert('請先登入並等待資料載入。');
            const rows = [['教案名稱','教案摘要','教案分類','教案狀態','講師姓名','建議類型','頁數或章節','建議內容','採納狀態','留言時間']];
            for (const lesson of lessons.filter(l => !l.isArchived && (!id || l.id === id))) {
                const comments = asList(lesson.comments);
                for (const c of comments.length ? comments : [{}]) rows.push([lesson.title, lesson.description, lesson.category, lesson.status, c.author, c.category, c.page, c.content || '尚無回饋', c.id ? (c.isAdopted ? '已採納' : '待討論') : '', c.createdAt]);
            }
            const csvCell = value => { let v = String(value ?? ''); if (/^[\s]*[=+@-]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
            const blob = new Blob(['\uFEFF' + rows.map(row => row.map(csvCell).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8;'});
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob);
            link.download = '教案回饋_' + (id || '全部') + '_' + new Date().toLocaleDateString('sv-SE') + '.csv';
            link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }

            e.preventDefault();
            if (!activeLessonId) return;
            if (!cloudReady) return alert('雲端尚未連線，請稍後再送出回饋。');

            if (!currentUser) return;
            const lesson = lessons.find(l => l.id === activeLessonId);
            if (!lesson) return;
            const author = document.getElementById('commentAuthor').value.trim();
            const category = document.getElementById('commentCategory').value;
            const page = document.getElementById('commentPage').value.trim();
            const content = document.getElementById('commentContent').value.trim();
            const editingId = document.getElementById('editingCommentId').value;

            if (!author) {
                alert('請先填寫您的姓名/講師名稱！');
                document.getElementById('commentAuthor').focus();
                return;
            }

            if (!content) return;
            localStorage.setItem('estate_user_name', author);

            const lessonPath = lessonPaths[lesson.id];
            if (lessonPath === undefined) return alert('教案尚未儲存至雲端，請先通知 PM 匯入。');
            if (editingId) {
                if (!isPMMode) return;
                const comment = lesson.comments.find(c => c.id === editingId);
                if (!comment) return;
                Object.assign(comment, {author,category,page,content});
                if (await saveToCloud()) cancelCommentEdit();
                return;
            }
            const id = 'c_' + crypto.randomUUID();
            const comment = {id,author,category,page,content,isAdopted:false,uid:currentUser.uid,createdAt:new Date().toLocaleString('zh-TW')};
            const button = document.getElementById('submitCommentBtn');
            button.disabled = true;
            try {
                await window.fbSet(window.fbRef(window.fbDb, 'estate_lessons/' + lessonPath + '/comments/' + id), comment);
                cancelCommentEdit(); syncMessage('回饋已儲存至雲端');
            } catch { syncMessage('回饋儲存失敗，請稍後再試', true); }
            finally { button.disabled = false; }
        }

        function toggleLock(id) {
            if (!isPMMode) return;
            const lesson = lessons.find(l => l.id === id);
            if (lesson) {
                lesson.isLocked = !lesson.isLocked;
                saveToCloud();
            }
        }

        function changeStatus(id, newStatus) {
            if (!isPMMode) return;
            const lesson = lessons.find(l => l.id === id);
            if (lesson) {
                lesson.status = newStatus;
                saveToCloud();
            }
        }

        function toggleAdoptComment(commentId) {
            if (!isPMMode) return;
            const lesson = lessons.find(l => l.id === activeLessonId);
            if (lesson && lesson.comments) {
                const comment = lesson.comments.find(c => c.id === commentId);
                if (comment) {
                    comment.isAdopted = !comment.isAdopted;
                    saveToCloud();
                }
            }
        }

        function filterCategory(cat) {
            currentFilterCat = cat;
            renderCategories();
            renderCards();
        }
    </script>
</body>
</html>
